conda_env_name: gwak-data
run_bootstrap_conda_data_env: true

paths:
  gwak_root: .
  # Directory for saving outputs including models, logs, checkpoints, and intermediate results
  gwak_output_dir: gwak/output
  # Top-level directory containing different versions of GWAK dataset
  gwak_data_dir: gwak/output/data
  # Directory for storing visualization artifacts and plots
  gwak_louvre_dir: gwak/output/plots
  # Directory for storing log files or compressed out/err.log from working nodes
  gwak_log_dir: gwak/output
  # Dataset directory for O4 MDC BBC short-0
  gwak_bbc_short_0_data_dir: gwak/output/data/O4_MDC_short-0
  # Dataset directory for O4 MDC BBC short-1
  gwak_bbc_short_1_data_dir: gwak/output/data/O4_MDC_short-1
  # Top-level directory to write or save container images
  image_dir: ~/Container/GWAK
  # Local directory for collecting outputs generated by containerized jobs
  contain_output_dir: ~/Container/GWAK

shell_path_prepend: []
