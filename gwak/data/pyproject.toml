[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data"
version = "0.1.0"
description = "GWAK data utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dqsegdb2>=1.3.0",
    "gwpy[pelican]==4.0.2",
    "jsonargparse[signatures]>=4.52.0",
    "lalsuite>=7.26.15",
    "ml4gw",
    "access",
    "machinery",
    "pycbc>=2.9.0",
    "python-ligo-lw==1.8.3",
    "cowsay>=6.1",
]

[tool.setuptools]
packages = ["data"]

[tool.uv.sources]
ml4gw = { path = "../../ml4gw", editable = true }
access = {path = "../../libs/access", editable = true }
machinery = {path = "../../libs/machinery", editable = true }
