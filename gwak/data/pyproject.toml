[project]
name = "data"
version = "0.1.0"
description = "GWAK data utilities"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dqsegdb2>=1.3.0",
    "gwpy[pelican]==4.0.2",
    "jsonargparse[signatures]>=4.52.0",
    "lalsuite>=7.26.15",
    "access",
    "machinery",
    "pycbc>=2.9.0",
    "python-ligo-lw==1.8.3",
    "cowsay>=6.1",
]

[tool.uv.sources]
access = {path = "../../libs/access", editable = true }
machinery = {path = "../../libs/machinery", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["data"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
