[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data"
version = "0.1.0"
description = "GWAK data utilities"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "dqsegdb2==1.1.3",
    # "gwpy==3.0.5",
    "lalsuite>=7.26.15",
    # "scipy==1.14.1",
    "ml4gw",
    "python-ligo-lw==1.8.3",
    # "pyomicron==2.0.4",
]

[tool.setuptools]
packages = ["data"]

[tool.uv.sources]
ml4gw = { path = "../../ml4gw", editable = true }
