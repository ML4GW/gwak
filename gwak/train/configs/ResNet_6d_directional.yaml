# lightning.pytorch==2.3.2
seed_everything: 0
trainer:
  callbacks:
    - class_path: callback.ValidationCallback
  accelerator: gpu
  devices: [0]
  # accelerator: auto
  # devices: auto
  #strategy: ddp_find_unused_parameters_true
  logger:
    class_path: lightning.pytorch.loggers.WandbLogger
    init_args:
      project: gwak_sg150_q9
      name: sg150_q9_IC110514A
      # entity: gwak
  log_every_n_steps: 1
  max_epochs: 5
  limit_val_batches: 10
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
ckpt_path: null
model:
  class_path: cl_models.Contour
  init_args:
    num_ifos: 2
    d_output: 6
    d_contrastive_space: 128
    resnet_layers: [3,4,6,3]
    resnet_kernel_size: 3
    temperature: 0.05
    temperature_init: null # not annealing temp
    n_temp_anneal: 10
    supervised_simclr: true
    lr: 1e-3
    min_lr: 1e-5
    cos_anneal: false
    cos_anneal_tmax: 50
    use_classifier: false
data:
  class_path: dataloader.SignalDataloader
  init_args:
    signal_classes:
      - "SineGaussian"
      - "Background"
    priors:
      - class_path: trainer.prior.FixedSineGaussianPrior # SineGaussian
      - null # Background
    waveforms:
      - class_path: ml4gw.waveforms.SineGaussian # SineGaussian
        init_args:
          sample_rate: 0
          duration: 0
      - null # Background
    extra_kwargs:
      - null # SineGaussian
      - null # Background
    sample_rate: 4096
    kernel_length: 1.0
    psd_length: 64
    fduration: 2
    fftlength: 3
    batch_size: 32
    batches_per_epoch: 8
    num_workers: 4
    data_saving_file: null
    loader_mode: "raw"
    anneal_snr: false
    rebalance_classes: false
    # ifos: HL
    glitch_root: null
    snr_prior: 
      class_path: torch.distributions.Uniform
      init_args:
        low: 4.0
        high: 30.0
    # event_ra_deg: 138.47
    # event_dec_deg: -1.94
    # event_time_utc: "2011-05-14T01:32:22.654109"
    # sky_window_deg: 1.0